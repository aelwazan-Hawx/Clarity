services:
  - type: web
    name: clarity-finance-tracker
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: cd ../frontend && npm install && npm run build && cp -r build ../backend/build && cd ../backend && npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: clarity-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
